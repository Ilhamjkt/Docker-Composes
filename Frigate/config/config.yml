    detect:
      width: 1280
      height: 720
      fps: 5

detect:
  enabled: true

record:
  enabled: true
  motion:
    days: 30
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

camera_groups:
  Site-A:
    order: 1
    icon: LuCctv
    cameras:
      - Camera-1
      - Camera-2
      - Camera-3
      - Camera-4
      - Camera-5
      - Camera-8
      - Camera-9
      - Camera-10
  Site-B:
    order: 1
    icon: LuCctv
    cameras:
      - Camera-6
      - Camera-7

version: 0.18-0

semantic_search:
  enabled: false
  model_size: small
face_recognition:
  enabled: false
  model_size: small
lpr:
  enabled: true
classification:
  bird:
    enabled: false

