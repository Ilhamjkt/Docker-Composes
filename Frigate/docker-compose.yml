services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    privileged: true          # needed for hardware access (GPU/Coral); can be removed if not using HW accel
    shm_size: "256mb"         # increase for many cameras / high resolution
    devices:
      - /dev/dri:/dev/dri     # Intel iGPU for hwaccel, remove if not available
    volumes:
      - ./config:/config
      - ./storage:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
#     - "5000:5000"    # Web http admin
      - "8971:8971"    # Web https://
      - "8554:8554"    # RTSP restream (go2rtc)
      - "8555:8555/tcp"
      - "8555:8555/udp" # WebRTC
    environment:
      FRIGATE_RTSP_PASSWORD: "change_me"

  mqtt:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config:/mosquitto/config
